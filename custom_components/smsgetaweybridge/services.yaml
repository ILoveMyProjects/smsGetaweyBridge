send_sms:
  name: Send SMS (direct or saved template)
  description: "Send a one-off SMS. For a saved template without JSON, choose its own action named 'Send SMS: template_name'."
  fields:
    phone_number:
      name: Phone number (direct SMS)
      description: Enter an international number for direct sending, or leave blank if using a template.
      required: false
      selector:
        text: {}
    message:
      name: Message (direct SMS)
      description: Plain text for direct sending; leave blank when selecting a saved template.
      required: false
      selector:
        text:
          multiline: true
    template:
      name: Saved template
      description: Populated automatically after installation and whenever templates change. The option includes group and variable names.
      required: false
      selector:
        text: {}
    variables:
      name: Template variables
      description: "Advanced mapping. For individual fields without JSON, select the separate 'Send SMS: template_name' action instead."
      required: false
      selector:
        object: {}
    entry_id:
      name: Gateway for direct SMS
      description: Only needed for direct sending with multiple phones. Saved templates select their gateway automatically.
      required: false
      selector:
        config_entry:
          integration: smsgetaweybridge
send_template:
  name: Send saved SMS template (advanced)
  description: "The message and recipients come from SMS Bridge -> Templates & Groups. For individual variable fields, use the dedicated 'Send SMS: template_name' action. No JSON is needed there."
  fields:
    template:
      required: true
      name: Saved SMS template
      description: Pick the template. Options include required variable names and group details.
      selector:
        text: {}
    variables:
      required: false
      name: Template variables
      description: "Advanced mapping only. For no-JSON fields select 'Send SMS: template_name' from the action picker."
      selector:
        object: {}
