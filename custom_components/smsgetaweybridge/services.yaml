send_sms:
  name: Send SMS (direct or saved template)
  description: Send a one-off SMS, or choose a saved template from the live list shown in the automation editor.
  fields:
    phone_number:
      name: Phone number (direct SMS)
      description: Enter an international number for direct sending, or leave blank if using a template.
      required: false
      selector:
        text: {}
    message:
      name: Message (direct SMS)
      description: Plain text for direct sending; leave blank when selecting a saved template.
      required: false
      selector:
        text:
          multiline: true
    template:
      name: Saved template
      description: Populated automatically after installation and whenever templates change. The option includes group and variable names.
      required: false
      selector:
        text: {}
    variables:
      name: Template variables
      description: "Enter a mapping of variable names to values, e.g. host to nas and state to offline. The option labels show required variables."
      required: false
      selector:
        object: {}
    entry_id:
      name: Gateway entry
      description: Optional when a single gateway is configured. The saved-template selector includes its gateway automatically.
      required: false
      selector:
        config_entry:
          integration: smsgetaweybridge
send_template:
  name: Send saved SMS template
  description: Choose a template from the saved list. Its recipient group and required variable names are displayed.
  fields:
    template:
      required: true
      name: Saved SMS template
      description: Pick the template. Options include required variable names and group details.
      selector:
        text: {}
    variables:
      required: false
      name: Template variables
      description: "Named variables are shown alongside the selected template. For example, set host to nas."
      selector:
        object: {}
    entry_id:
      required: false
      name: Gateway entry
      selector:
        config_entry:
          integration: smsgetaweybridge
